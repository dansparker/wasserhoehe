<text class="ts" x="122" y="251" dominant-baseline="central">nein</text>
<g class="c-gray"><rect x="20" y="280" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="110" y="302" text-anchor="middle" dominant-baseline="central">Ignorieren</text></g>
<g class="c-purple"><rect x="240" y="180" width="290" height="56" rx="8" stroke-width="0.5"/><text class="th" x="385" y="198" text-anchor="middle" dominant-baseline="central">Sendekriterium erfüllt?</text><text class="ts" x="385" y="218" text-anchor="middle" dominant-baseline="central">neu · Statuswechsel · ≥ 1 cm · 5 min</text></g>
<line x1="385" y1="236" x2="385" y2="278" class="arr" marker-end="url(#arrow)"/>
